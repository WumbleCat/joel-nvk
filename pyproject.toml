[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "joel-nvk"
version = "0.1.0"
description = "joel-nvk"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
# The heavy ML stack. Not installed by default — `uv sync --group ml` when you
# need to run the pipeline, so a docs-only checkout stays small.
ml = [
    "torch>=2.4",
    "transformers>=4.44",
    "peft>=0.13",
    "datasets>=3.0",
    "accelerate>=0.34",
    "safetensors>=0.4",
]

# Installed by `uv sync` (the default group). Skip with `uv sync --no-dev`.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "jupyter>=1.0",
]

[project.scripts]
joel-nvk = "joel_nvk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/joel_nvk"]

[tool.uv]
# Keep the project itself editable so `uv run` picks up src/ edits without reinstalling.
package = true
# `ml` is opt-in: uv sync --group ml
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: tests that take more than a second",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
packages = ["joel_nvk"]
mypy_path = "src"
ignore_missing_imports = true
